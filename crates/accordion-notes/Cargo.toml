[package]
name = "accordion-notes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
accordion-core = { git = "https://github.com/accordion-suite/accordion-core", version = "0.1.0" }
accordion-module = { git = "https://github.com/accordion-suite/accordion-core", version = "0.1.0" }
accordion-types = { git = "https://github.com/accordion-suite/accordion-core", version = "0.1.0" }
axum = { version = "0.8.9", features = ["ws"] }
# Time zones for reminders. The bundled list is used where the system has
# none, such as a slim container.
jiff = { version = "0.2.42", default-features = false, features = ["std", "tzdb-bundle-always", "tzdb-zoneinfo"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["io-util", "sync", "time"] }
tracing = "0.1.44"
yrs = "0.28.1"

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
